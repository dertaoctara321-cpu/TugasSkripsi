<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="Arial, sans-serif">
  <rect width="1440" height="960" fill="#F0F0F0"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="960" fill="#444444"/>
  <rect x="14" y="14" width="40" height="40" rx="20" fill="#666666"/>
  <rect x="62" y="20" width="110" height="9" rx="2" fill="#666666"/>
  <rect x="62" y="34" width="80" height="7" rx="2" fill="#555555"/>
  <rect x="0" y="68" width="240" height="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="18" y="82" width="16" height="16" rx="2" fill="#555555"/>
  <text x="42" y="95" font-size="11" fill="#888888">Dashboard</text>
  <rect x="18" y="122" width="16" height="16" rx="2" fill="#555555"/>
  <text x="42" y="135" font-size="11" fill="#888888">Menu</text>
  <rect x="0" y="152" width="4" height="40" fill="#AAAAAA"/>
  <rect x="0" y="152" width="240" height="40" fill="rgba(255,255,255,0.08)"/>
  <rect x="18" y="162" width="16" height="16" rx="2" fill="#888888"/>
  <text x="42" y="175" font-size="11" fill="#CCCCCC">Meja &amp; QR</text>
  <rect x="18" y="202" width="16" height="16" rx="2" fill="#555555"/>
  <text x="42" y="215" font-size="11" fill="#888888">Metode Pembayaran</text>
  <rect x="18" y="242" width="16" height="16" rx="2" fill="#555555"/>
  <text x="42" y="255" font-size="11" fill="#888888">Pesanan</text>
  <rect x="18" y="282" width="16" height="16" rx="2" fill="#555555"/>
  <text x="42" y="295" font-size="11" fill="#888888">Laporan</text>
  <rect x="10" y="880" width="220" height="30" rx="4" fill="#555555"/>
  <text x="120" y="899" text-anchor="middle" font-size="11" fill="#999999">Dark Mode</text>
  <rect x="10" y="916" width="220" height="28" rx="4" fill="#666666"/>
  <text x="120" y="934" text-anchor="middle" font-size="11" fill="#999999">Logout</text>
  <!-- Topbar -->
  <rect x="240" y="0" width="1200" height="52" fill="#CCCCCC"/>
  <rect x="257" y="17" width="18" height="5" rx="1" fill="#999999"/>
  <rect x="257" y="26" width="14" height="5" rx="1" fill="#999999"/>
  <rect x="257" y="35" width="16" height="5" rx="1" fill="#999999"/>
  <rect x="1330" y="18" width="80" height="16" rx="3" fill="#BBBBBB"/>
  <!-- content-header -->
  <text x="260" y="82" font-size="20" font-weight="bold" fill="#555555">Edit Meja</text>
  <rect x="260" y="90" width="120" height="8" rx="2" fill="#DDDDDD"/>
  <!-- Form Card -->
  <rect x="260" y="108" width="1120" height="520" rx="6" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1"/>
  <rect x="260" y="108" width="1120" height="44" rx="6" fill="#EEEEEE"/>
  <rect x="260" y="130" width="1120" height="22" fill="#EEEEEE"/>
  <rect x="278" y="120" width="16" height="16" rx="2" fill="#DDDDDD"/>
  <text x="302" y="133" font-size="12" font-weight="bold" fill="#666666">Edit Meja</text>
  <!-- Nomor Meja (pre-filled) -->
  <text x="278" y="174" font-size="11" font-weight="bold" fill="#888888">Nomor Meja</text>
  <rect x="278" y="180" width="1062" height="40" rx="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="290" y="196" width="60" height="8" rx="2" fill="#DDDDDD"/>
  <text x="290" y="200" font-size="10" fill="#AAAAAA">Meja 1</text>
  <!-- Latitude (pre-filled) -->
  <text x="278" y="242" font-size="11" font-weight="bold" fill="#888888">Latitude Lokasi Meja</text>
  <rect x="278" y="248" width="1062" height="40" rx="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="290" y="264" width="100" height="8" rx="2" fill="#DDDDDD"/>
  <text x="278" y="298" font-size="9" fill="#AAAAAA">Koordinat latitude lokasi meja (Google Maps)</text>
  <!-- Longitude (pre-filled) -->
  <text x="278" y="322" font-size="11" font-weight="bold" fill="#888888">Longitude Lokasi Meja</text>
  <rect x="278" y="328" width="1062" height="40" rx="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="290" y="344" width="100" height="8" rx="2" fill="#DDDDDD"/>
  <text x="278" y="378" font-size="9" fill="#AAAAAA">Koordinat longitude lokasi meja (Google Maps)</text>
  <!-- Info box -->
  <rect x="278" y="394" width="1062" height="80" rx="6" fill="#F0F8FF" stroke="#CCDDEE" stroke-width="1"/>
  <text x="300" y="416" font-size="11" font-weight="bold" fill="#6688AA">Cara mendapatkan koordinat:</text>
  <text x="300" y="436" font-size="10" fill="#7799BB">1. Buka Google Maps  2. Klik kanan pada lokasi meja "What's here?"  3. Copy koordinat (lat, lng)</text>
  <!-- Buttons -->
  <rect x="278" y="494" width="180" height="44" rx="6" fill="#CCCCCC"/>
  <text x="368" y="520" text-anchor="middle" font-size="12" fill="#666666">Update Meja</text>
  <rect x="470" y="494" width="140" height="44" rx="6" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1"/>
  <text x="540" y="520" text-anchor="middle" font-size="12" fill="#888888">Kembali</text>
  <!-- Footer -->
  <rect x="240" y="908" width="1200" height="36" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1"/>
  <text x="840" y="922" text-anchor="middle" font-size="10" font-weight="bold" fill="#666666">Copyright 2025 Little Palembang. All rights reserved.</text>
  <text x="840" y="936" text-anchor="middle" font-size="9" fill="#AAAAAA">Lorok Pakjo, Kec. Ilir Bar. I, Kota Palembang, Sumatera Selatan.</text>
</svg>
