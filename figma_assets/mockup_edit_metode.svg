      <stop offset="0%" style="stop-color:#7B0000"/><stop offset="100%" style="stop-color:#5D0000"/>
    </linearGradient>
    <linearGradient id="tbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C0392B"/><stop offset="100%" style="stop-color:#E74C3C"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="960" fill="#F5F5F5"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="250" height="960" fill="url(#sbGrad)"/>
  <rect x="14" y="14" width="44" height="44" rx="22" fill="white"/>
