  <text x="1318" y="286" text-anchor="end" font-size="14" fill="#AAAAAA">&#9660;</text>
  <!-- Nomor Rekening (disabled/hidden for QRIS) -->
  <text x="290" y="328" font-size="12" font-weight="600" fill="#CCCCCC">Nomor Rekening</text>
  <rect x="290" y="334" width="1040" height="46" rx="8" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="2"/>
  <text x="306" y="362" font-size="13" fill="#CCCCCC">Tidak digunakan untuk QRIS</text>
  <!-- Atas Nama (disabled/hidden for QRIS) -->
  <text x="290" y="404" font-size="12" font-weight="600" fill="#CCCCCC">Atas Nama</text>
  <rect x="290" y="410" width="1040" height="46" rx="8" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="2"/>
  <text x="306" y="438" font-size="13" fill="#CCCCCC">Tidak digunakan untuk QRIS</text>
  <!-- QR Code existing -->
  <text x="290" y="480" font-size="12" font-weight="600" fill="#555">QR Code Saat Ini</text>
  <rect x="290" y="486" width="140" height="140" rx="10" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="2"/>
  <!-- Simple QR visual -->
  <rect x="302" y="498" width="18" height="18" rx="2" fill="#C0392B"/>
  <rect x="400" y="498" width="18" height="18" rx="2" fill="#C0392B"/>
  <rect x="302" y="596" width="18" height="18" rx="2" fill="#C0392B"/>
  <rect x="400" y="596" width="18" height="18" rx="2" fill="#C0392B"/>
  <rect x="330" y="522" width="6" height="6" fill="#333"/>
  <rect x="340" y="532" width="6" height="6" fill="#333"/>
  <rect x="350" y="522" width="6" height="6" fill="#333"/>
  <rect x="360" y="540" width="6" height="6" fill="#333"/>
  <rect x="370" y="528" width="6" height="6" fill="#333"/>
  <text x="360" y="645" text-anchor="middle" font-size="10" fill="#888">qris_bri.png</text>
  <!-- Ganti QR -->
  <text x="290" y="666" font-size="12" font-weight="600" fill="#555">Ganti QR Code <tspan font-size="10" fill="#999">(Opsional)</tspan></text>
  <rect x="290" y="672" width="1040" height="50" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <rect x="294" y="676" width="100" height="42" rx="6" fill="#EEEEEE"/>
  <text x="344" y="702" text-anchor="middle" font-size="11" fill="#888">Pilih File</text>
  <text x="406" y="700" font-size="12" fill="#AAAAAA">Format: JPG, PNG. Maksimal 2MB</text>
  <!-- Instruksi (pre-filled) -->
  <text x="290" y="742" font-size="12" font-weight="600" fill="#555">Instruksi Tambahan <tspan font-size="10" fill="#999">(Opsional)</tspan></text>
  <rect x="290" y="748" width="1040" height="70" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="306" y="774" font-size="13" fill="#555">Scan QR berikut untuk melakukan pembayaran.</text>
  <!-- Status (pre-filled) -->
  <text x="290" y="836" font-size="12" font-weight="600" fill="#555">Status</text>
  <rect x="290" y="842" width="1040" height="46" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="306" y="870" font-size="13" fill="#333">Aktif</text>
  <text x="1318" y="870" text-anchor="end" font-size="14" fill="#AAAAAA">&#9660;</text>
