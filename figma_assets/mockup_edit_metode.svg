  <text x="270" y="32" font-size="20" fill="white">&#9776;</text>
  <text x="1410" y="33" text-anchor="end" font-size="13" fill="white">Logout</text>
  <!-- content-header -->
  <text x="270" y="82" font-size="22" font-weight="bold" fill="#333">Edit Metode Pembayaran</text>
