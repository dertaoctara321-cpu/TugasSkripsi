  <!-- Form Card -->
  <rect x="270" y="108" width="1110" height="800" rx="12" fill="white" stroke="#EEEEEE" stroke-width="1"/>
  <rect x="270" y="108" width="1110" height="48" rx="12" fill="#FAFAFA"/>
  <rect x="270" y="132" width="1110" height="24" fill="#FAFAFA"/>
  <text x="298" y="136" font-size="14" font-weight="bold" fill="#333">&#9998; Edit Metode Pembayaran</text>
