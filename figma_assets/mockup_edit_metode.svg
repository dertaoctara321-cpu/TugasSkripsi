  <rect x="250" y="908" width="1190" height="36" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1"/>
  <text x="845" y="922" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Copyright &#169; 2025 Little Palembang. All rights reserved.</text>
  <text x="845" y="936" text-anchor="middle" font-size="10" fill="#999">Lorok Pakjo, Kec. Ilir Bar. I, Kota Palembang, Sumatera Selatan.</text>
