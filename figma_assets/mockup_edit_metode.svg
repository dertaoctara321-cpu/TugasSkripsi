  <text x="66" y="30" font-size="14" font-weight="bold" fill="white">Little Palembang</text>
  <text x="66" y="48" font-size="11" fill="rgba(255,255,255,0.6)">Administrator</text>
  <rect x="0" y="68" width="250" height="1" fill="rgba(255,255,255,0.1)"/>
  <text x="24" y="103" font-size="15" fill="rgba(255,255,255,0.65)">&#128202;</text>
