<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="1440" height="900" fill="#F0F0F0"/>
  <!-- Card -->
  <rect x="520" y="100" width="400" height="480" rx="12" fill="white" stroke="#CCCCCC" stroke-width="1.5"/>
  <!-- Logo placeholder circle -->
  <circle cx="720" cy="180" r="40" fill="none" stroke="#999" stroke-width="1.5"/>
  <line x1="691" y1="151" x2="749" y2="209" stroke="#999" stroke-width="1.5"/>
  <line x1="749" y1="151" x2="691" y2="209" stroke="#999" stroke-width="1.5"/>
  <!-- Title placeholder -->
  <rect x="620" y="240" width="200" height="14" rx="3" fill="#CCCCCC"/>
  <!-- Subtitle placeholder -->
  <rect x="650" y="264" width="140" height="10" rx="3" fill="#E0E0E0"/>
  <!-- Email label -->
  <rect x="560" y="300" width="80" height="9" rx="2" fill="#CCCCCC"/>
  <!-- Email input -->
  <rect x="560" y="316" width="320" height="40" rx="6" fill="white" stroke="#CCCCCC" stroke-width="1.5"/>
  <rect x="572" y="333" width="120" height="8" rx="2" fill="#E0E0E0"/>
  <!-- Password label -->
  <rect x="560" y="372" width="70" height="9" rx="2" fill="#CCCCCC"/>
  <!-- Password input -->
  <rect x="560" y="388" width="320" height="40" rx="6" fill="white" stroke="#CCCCCC" stroke-width="1.5"/>
  <rect x="572" y="405" width="100" height="8" rx="2" fill="#E0E0E0"/>
  <!-- Remember me -->
  <rect x="560" y="444" width="14" height="14" rx="2" fill="none" stroke="#CCCCCC" stroke-width="1.5"/>
  <rect x="582" y="447" width="80" height="8" rx="2" fill="#E0E0E0"/>
  <!-- Login button -->
  <rect x="560" y="474" width="320" height="44" rx="6" fill="#333333"/>
  <rect x="670" y="492" width="100" height="10" rx="2" fill="#999999"/>
  <!-- Forgot password -->
  <rect x="640" y="534" width="160" height="8" rx="2" fill="#E0E0E0"/>
  <!-- Label texts -->
  <text x="560" y="295" font-size="11" fill="#999">EMAIL ADDRESS</text>
  <text x="560" y="368" font-size="11" fill="#999">PASSWORD</text>
  <text x="582" y="455" font-size="11" fill="#999">Remember me</text>
  <text x="720" y="499" text-anchor="middle" font-size="13" font-weight="bold" fill="#888888">LOGIN</text>
  <text x="720" y="542" text-anchor="middle" font-size="11" fill="#BBBBBB">Forgot your password?</text>
  <!-- Page label -->
  <text x="720" y="620" text-anchor="middle" font-size="12" fill="#AAAAAA">[ Login Page — Admin ]</text>
</svg>
