<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="Arial, sans-serif">
  <rect width="1440" height="960" fill="#F0F0F0"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="960" fill="#444444"/>
  <rect x="14" y="14" width="40" height="40" rx="20" fill="#666666"/>
  <rect x="62" y="20" width="110" height="9" rx="2" fill="#666666"/>
  <rect x="62" y="34" width="80" height="7" rx="2" fill="#555555"/>
  <rect x="0" y="68" width="240" height="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="18" y="82" width="16" height="16" rx="2" fill="#555555"/>
  <text x="42" y="95" font-size="11" fill="#888888">Dashboard</text>
  <rect x="0" y="112" width="4" height="40" fill="#AAAAAA"/>
  <rect x="0" y="112" width="240" height="40" fill="rgba(255,255,255,0.08)"/>
  <rect x="18" y="122" width="16" height="16" rx="2" fill="#888888"/>
  <text x="42" y="135" font-size="11" fill="#CCCCCC">Menu</text>
  <rect x="18" y="162" width="16" height="16" rx="2" fill="#555555"/>
  <text x="42" y="175" font-size="11" fill="#888888">Meja &amp; QR</text>
  <rect x="18" y="202" width="16" height="16" rx="2" fill="#555555"/>
  <text x="42" y="215" font-size="11" fill="#888888">Metode Pembayaran</text>
  <rect x="18" y="242" width="16" height="16" rx="2" fill="#555555"/>
  <text x="42" y="255" font-size="11" fill="#888888">Pesanan</text>
  <rect x="18" y="282" width="16" height="16" rx="2" fill="#555555"/>
  <text x="42" y="295" font-size="11" fill="#888888">Laporan</text>
  <rect x="10" y="880" width="220" height="30" rx="4" fill="#555555"/>
  <text x="120" y="899" text-anchor="middle" font-size="11" fill="#999999">Dark Mode</text>
  <rect x="10" y="916" width="220" height="28" rx="4" fill="#666666"/>
  <text x="120" y="934" text-anchor="middle" font-size="11" fill="#999999">Logout</text>
  <!-- Topbar -->
  <rect x="240" y="0" width="1200" height="52" fill="#CCCCCC"/>
  <rect x="257" y="17" width="18" height="5" rx="1" fill="#999999"/>
  <rect x="257" y="26" width="14" height="5" rx="1" fill="#999999"/>
  <rect x="257" y="35" width="16" height="5" rx="1" fill="#999999"/>
  <rect x="1330" y="18" width="80" height="16" rx="3" fill="#BBBBBB"/>
  <!-- content-header -->
  <text x="260" y="82" font-size="20" font-weight="bold" fill="#555555">Edit Menu</text>
  <rect x="260" y="90" width="130" height="8" rx="2" fill="#DDDDDD"/>
  <!-- Form Card -->
  <rect x="260" y="108" width="1120" height="780" rx="6" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1"/>
  <rect x="260" y="108" width="1120" height="44" rx="6" fill="#EEEEEE"/>
  <rect x="260" y="130" width="1120" height="22" fill="#EEEEEE"/>
  <rect x="278" y="120" width="16" height="16" rx="2" fill="#DDDDDD"/>
  <text x="302" y="133" font-size="12" font-weight="bold" fill="#666666">Edit Menu</text>
  <!-- Row 1: Nama Menu + Harga -->
  <text x="278" y="174" font-size="11" font-weight="bold" fill="#888888">Nama Menu</text>
  <rect x="278" y="180" width="516" height="40" rx="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <!-- pre-filled value indicator -->
  <rect x="290" y="196" width="200" height="8" rx="2" fill="#DDDDDD"/>
  <text x="824" y="174" font-size="11" font-weight="bold" fill="#888888">Harga</text>
  <rect x="824" y="180" width="516" height="40" rx="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="836" y="196" width="120" height="8" rx="2" fill="#DDDDDD"/>
  <!-- Deskripsi -->
  <text x="278" y="242" font-size="11" font-weight="bold" fill="#888888">Deskripsi</text>
  <rect x="278" y="248" width="1062" height="80" rx="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="290" y="262" width="350" height="8" rx="2" fill="#DDDDDD"/>
  <rect x="290" y="278" width="250" height="8" rx="2" fill="#EEEEEE"/>
  <!-- Row 2: Kategori + Sub Kategori -->
  <text x="278" y="352" font-size="11" font-weight="bold" fill="#888888">Kategori</text>
  <rect x="278" y="358" width="516" height="40" rx="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="290" y="374" width="100" height="8" rx="2" fill="#DDDDDD"/>
  <text x="802" y="374" text-anchor="end" font-size="11" fill="#AAAAAA">v</text>
  <text x="824" y="352" font-size="11" font-weight="bold" fill="#888888">Sub Kategori (opsional)</text>
  <rect x="824" y="358" width="516" height="40" rx="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="836" y="374" width="180" height="8" rx="2" fill="#DDDDDD"/>
  <!-- Row 3: Ketersediaan -->
  <text x="278" y="422" font-size="11" font-weight="bold" fill="#888888">Ketersediaan</text>
  <rect x="278" y="428" width="516" height="40" rx="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="290" y="444" width="80" height="8" rx="2" fill="#DDDDDD"/>
  <text x="802" y="444" text-anchor="end" font-size="11" fill="#AAAAAA">v</text>
  <!-- Gambar Menu -->
  <text x="278" y="492" font-size="11" font-weight="bold" fill="#888888">Gambar Menu (ganti gambar)</text>
  <rect x="278" y="498" width="1062" height="40" rx="4" fill="#FAFAFA" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="809" y="523" text-anchor="middle" font-size="10" fill="#AAAAAA">Pilih file gambar baru...</text>
  <!-- Current image section -->
  <text x="278" y="558" font-size="11" fill="#888888">Gambar Saat Ini:</text>
  <rect x="278" y="564" width="180" height="160" rx="6" fill="#EEEEEE" stroke="#DDDDDD" stroke-width="1"/>
  <text x="368" y="652" text-anchor="middle" font-size="22" fill="#CCCCCC">img</text>
  <text x="368" y="672" text-anchor="middle" font-size="9" fill="#AAAAAA">pempek_kapal_selam.jpg</text>
  <!-- New image preview -->
  <rect x="476" y="564" width="180" height="160" rx="6" fill="#F5F5F5" stroke="#DDDDDD" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="566" y="652" text-anchor="middle" font-size="9" fill="#CCCCCC">Preview baru</text>
  <!-- Divider -->
  <rect x="278" y="754" width="1062" height="1" fill="#EEEEEE"/>
  <!-- Buttons -->
  <rect x="278" y="768" width="160" height="44" rx="6" fill="#CCCCCC"/>
  <text x="358" y="794" text-anchor="middle" font-size="12" fill="#666666">Update Menu</text>
  <rect x="450" y="768" width="160" height="44" rx="6" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1"/>
  <text x="530" y="794" text-anchor="middle" font-size="12" fill="#888888">Kembali</text>
  <!-- Footer -->
  <rect x="240" y="908" width="1200" height="36" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1"/>
  <text x="840" y="922" text-anchor="middle" font-size="10" font-weight="bold" fill="#666666">Copyright 2025 Little Palembang. All rights reserved.</text>
  <text x="840" y="936" text-anchor="middle" font-size="9" fill="#AAAAAA">Lorok Pakjo, Kec. Ilir Bar. I, Kota Palembang, Sumatera Selatan.</text>
</svg>
