  <!-- Table card -->
  <rect x="260" y="100" width="1136" height="560" rx="6" fill="white" stroke="#DDDDDD" stroke-width="1"/>
  <rect x="260" y="100" width="1136" height="44" rx="6" fill="#EEEEEE"/>
  <rect x="260" y="128" width="1136" height="16" fill="#EEEEEE"/>
  <text x="278" y="128" font-size="12" font-weight="bold" fill="#666">Daftar Meja</text>
  <!-- Table header -->
  <rect x="275" y="156" width="1106" height="32" rx="4" fill="#E5E5E5"/>
  <text x="292" y="176" font-size="10" font-weight="bold" fill="#888">NO</text>
  <text x="350" y="176" font-size="10" font-weight="bold" fill="#888">NOMOR MEJA</text>
  <text x="500" y="176" font-size="10" font-weight="bold" fill="#888">QR CODE</text>
  <text x="680" y="176" font-size="10" font-weight="bold" fill="#888">URL TESTING</text>
  <text x="900" y="176" font-size="10" font-weight="bold" fill="#888">STATUS</text>
  <text x="1020" y="176" font-size="10" font-weight="bold" fill="#888">VALIDASI LOKASI</text>
  <text x="1220" y="176" font-size="10" font-weight="bold" fill="#888">AKSI</text>
  <!-- Row 1 -->
  <text x="292" y="216" font-size="12" fill="#555">1</text>
  <text x="350" y="216" font-size="12" fill="#555">Meja 1</text>
  <!-- QR placeholder box -->
  <rect x="480" y="200" width="80" height="80" rx="3" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1"/>
  <line x1="480" y1="200" x2="560" y2="280" stroke="#CCCCCC" stroke-width="1"/>
  <line x1="560" y1="200" x2="480" y2="280" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="480" y="286" width="80" height="20" rx="3" fill="#E0E0E0"/>
  <text x="520" y="300" text-anchor="middle" font-size="8" fill="#888">Download QR</text>
  <!-- URL -->
  <rect x="660" y="210" width="180" height="14" rx="2" fill="#E0E0E0"/>
  <rect x="660" y="232" width="140" height="10" rx="2" fill="#EEEEEE"/>
  <!-- Status badge -->
  <rect x="880" y="208" width="62" height="18" rx="9" fill="#EEEEEE"/>
  <text x="911" y="221" text-anchor="middle" font-size="9" fill="#888">Tersedia</text>
  <!-- Location toggle -->
  <rect x="1000" y="208" width="48" height="18" rx="9" fill="#EEEEEE"/>
  <text x="1024" y="221" text-anchor="middle" font-size="9" fill="#888">Aktif</text>
  <rect x="1000" y="234" width="50" height="18" rx="3" fill="#E0E0E0"/>
  <text x="1025" y="247" text-anchor="middle" font-size="9" fill="#888">Toggle</text>
  <!-- Actions -->
  <rect x="1200" y="236" width="60" height="20" rx="3" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1"/>
  <text x="1230" y="249" text-anchor="middle" font-size="9" fill="#888">Hapus</text>
  <!-- Row 2 -->
  <line x1="275" y1="320" x2="1381" y2="320" stroke="#F0F0F0" stroke-width="1"/>
  <text x="292" y="357" font-size="12" fill="#555">2</text>
  <text x="350" y="357" font-size="12" fill="#555">Meja 2</text>
  <rect x="480" y="335" width="80" height="80" rx="3" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1"/>
  <line x1="480" y1="335" x2="560" y2="415" stroke="#CCCCCC" stroke-width="1"/>
  <line x1="560" y1="335" x2="480" y2="415" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="480" y="421" width="80" height="20" rx="3" fill="#E0E0E0"/>
  <text x="520" y="435" text-anchor="middle" font-size="8" fill="#888">Download QR</text>
  <rect x="660" y="345" width="180" height="14" rx="2" fill="#E0E0E0"/>
  <rect x="660" y="367" width="140" height="10" rx="2" fill="#EEEEEE"/>
  <rect x="880" y="343" width="52" height="18" rx="9" fill="#EEEEEE"/>
  <text x="906" y="356" text-anchor="middle" font-size="9" fill="#888">Terisi</text>
  <rect x="1000" y="343" width="48" height="18" rx="9" fill="#EEEEEE"/>
  <text x="1024" y="356" text-anchor="middle" font-size="9" fill="#888">Aktif</text>
  <rect x="1000" y="369" width="50" height="18" rx="3" fill="#E0E0E0"/>
  <text x="1025" y="382" text-anchor="middle" font-size="9" fill="#888">Toggle</text>
  <rect x="1142" y="369" width="54" height="20" rx="3" fill="#E0E0E0"/>
  <text x="1169" y="382" text-anchor="middle" font-size="9" fill="#888">Kosongkan</text>
  <rect x="1200" y="369" width="60" height="20" rx="3" fill="#EEEEEE" stroke="#CCCCCC" stroke-width="1"/>
  <text x="1230" y="382" text-anchor="middle" font-size="9" fill="#888">Hapus</text>
  <!-- Footer -->
  <rect x="240" y="848" width="1200" height="36" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1"/>
  <rect x="450" y="858" width="400" height="8" rx="2" fill="#E0E0E0"/>
  <rect x="480" y="872" width="340" height="7" rx="2" fill="#E8E8E8"/>
</svg>
