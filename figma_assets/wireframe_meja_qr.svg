<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Arial, sans-serif">
  <rect width="1440" height="900" fill="#F0F0F0"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="900" fill="#444"/>
  <circle cx="36" cy="36" r="20" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="36" y="41" text-anchor="middle" font-size="11" fill="#888">LP</text>
  <rect x="64" y="24" width="120" height="9" rx="2" fill="#666"/>
  <rect x="64" y="38" width="80" height="7" rx="2" fill="#555"/>
  <text x="44" y="97" font-size="10" fill="#888">Dashboard</text>
  <rect x="20" y="84" width="16" height="16" rx="2" fill="#555"/>
  <text x="44" y="137" font-size="10" fill="#888">Menu</text>
  <rect x="20" y="124" width="16" height="16" rx="2" fill="#555"/>
  <rect x="0" y="156" width="4" height="40" fill="#AAAAAA"/>
  <rect x="20" y="164" width="16" height="16" rx="2" fill="#888"/>
  <text x="44" y="177" font-size="10" fill="#CCC">Meja &amp; QR</text>
  <text x="44" y="217" font-size="10" fill="#888">Metode Pembayaran</text>
  <rect x="20" y="204" width="16" height="16" rx="2" fill="#555"/>
  <text x="44" y="257" font-size="10" fill="#888">Pesanan</text>
  <rect x="20" y="244" width="16" height="16" rx="2" fill="#555"/>
  <text x="44" y="297" font-size="10" fill="#888">Laporan</text>
  <rect x="20" y="284" width="16" height="16" rx="2" fill="#555"/>
  <rect x="12" y="820" width="216" height="32" rx="4" fill="#555"/>
  <rect x="12" y="858" width="216" height="32" rx="4" fill="#666"/>
  <!-- Topbar: only hamburger + logout, NO title -->
  <rect x="240" y="0" width="1200" height="52" fill="#CCCCCC"/>
  <rect x="258" y="17" width="18" height="5" rx="1" fill="#999"/>
  <rect x="258" y="26" width="14" height="5" rx="1" fill="#999"/>
  <rect x="258" y="35" width="16" height="5" rx="1" fill="#999"/>
  <rect x="1330" y="18" width="80" height="16" rx="3" fill="#BBBBBB"/>
  <!-- Content header: page title inside content-wrapper -->
  <text x="270" y="82" font-size="18" font-weight="bold" fill="#555">Meja &amp; QR</text>
  <!-- Action button -->
  <rect x="1280" y="64" width="120" height="30" rx="4" fill="#DDDDDD" stroke="#CCCCCC" stroke-width="1"/>
