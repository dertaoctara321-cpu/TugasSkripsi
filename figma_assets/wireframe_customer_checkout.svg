  <text x="360" y="141" font-size="9" font-weight="bold" fill="#888888">TOTAL</text>
  <!-- Row 1 -->
  <rect x="46" y="164" width="130" height="8" rx="2" fill="#E0E0E0"/>
  <rect x="240" y="164" width="18" height="8" rx="2" fill="#E0E0E0"/>
  <rect x="290" y="164" width="52" height="8" rx="2" fill="#E0E0E0"/>
  <rect x="354" y="164" width="36" height="8" rx="2" fill="#E0E0E0"/>
  <rect x="28" y="182" width="374" height="1" fill="#F5F5F5"/>
  <!-- Row 2 -->
  <rect x="46" y="196" width="110" height="8" rx="2" fill="#E0E0E0"/>
  <rect x="240" y="196" width="18" height="8" rx="2" fill="#E0E0E0"/>
  <rect x="290" y="196" width="52" height="8" rx="2" fill="#E0E0E0"/>
  <rect x="354" y="196" width="36" height="8" rx="2" fill="#E0E0E0"/>
  <rect x="28" y="214" width="374" height="1" fill="#F5F5F5"/>
  <!-- Total row -->
  <rect x="28" y="306" width="374" height="34" rx="4" fill="#EEEEEE"/>
  <rect x="40" y="319" width="70" height="8" rx="2" fill="#CCCCCC"/>
  <rect x="310" y="319" width="80" height="8" rx="2" fill="#CCCCCC"/>
  <!-- Form fields -->
  <text x="30" y="368" font-size="10" fill="#888888">Nama Anda</text>
  <rect x="28" y="376" width="374" height="38" rx="4" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="40" y="391" width="130" height="8" rx="2" fill="#EEEEEE"/>
  <text x="30" y="432" font-size="10" fill="#888888">Lantai Kafe</text>
  <rect x="28" y="440" width="374" height="38" rx="4" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="40" y="455" width="100" height="8" rx="2" fill="#EEEEEE"/>
  <text x="390" y="463" text-anchor="end" font-size="11" fill="#AAAAAA">v</text>
  <text x="30" y="498" font-size="10" fill="#888888">Metode Pembayaran</text>
  <rect x="28" y="506" width="374" height="38" rx="4" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="40" y="521" width="80" height="8" rx="2" fill="#EEEEEE"/>
  <text x="390" y="529" text-anchor="end" font-size="11" fill="#AAAAAA">v</text>
