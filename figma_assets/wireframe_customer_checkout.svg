<svg xmlns="http://www.w3.org/2000/svg" width="430" height="860" viewBox="0 0 430 860" font-family="Arial, sans-serif">
  <rect x="3" y="3" width="424" height="854" rx="44" fill="#333333" stroke="#222222" stroke-width="2"/>
  <rect x="16" y="16" width="398" height="828" rx="36" fill="#EEEEEE"/>
  <rect x="152" y="16" width="130" height="26" rx="13" fill="#333333"/>
