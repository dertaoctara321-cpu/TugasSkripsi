<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="sbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7B0000"/><stop offset="100%" style="stop-color:#5D0000"/>
    </linearGradient>
    <linearGradient id="tbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C0392B"/><stop offset="100%" style="stop-color:#E74C3C"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="960" fill="#F5F5F5"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="250" height="960" fill="url(#sbGrad)"/>
  <rect x="14" y="14" width="44" height="44" rx="22" fill="white"/>
  <text x="36" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">LP</text>
  <text x="66" y="30" font-size="14" font-weight="bold" fill="white">Little Palembang</text>
  <text x="66" y="48" font-size="11" fill="rgba(255,255,255,0.6)">Administrator</text>
  <rect x="0" y="68" width="250" height="1" fill="rgba(255,255,255,0.1)"/>
  <text x="24" y="103" font-size="15" fill="rgba(255,255,255,0.65)">&#128202;</text>
  <text x="50" y="103" font-size="13" fill="rgba(255,255,255,0.65)">Dashboard</text>
  <!-- Active: Menu -->
  <rect x="0" y="116" width="4" height="44" fill="white"/>
  <rect x="0" y="116" width="250" height="44" fill="rgba(255,255,255,0.12)"/>
  <text x="24" y="143" font-size="15" fill="white">&#127859;</text>
  <text x="50" y="143" font-size="13" font-weight="600" fill="white">Menu</text>
  <text x="24" y="183" font-size="15" fill="rgba(255,255,255,0.65)">&#128082;</text>
  <text x="50" y="183" font-size="13" fill="rgba(255,255,255,0.65)">Meja &amp; QR</text>
  <text x="24" y="223" font-size="15" fill="rgba(255,255,255,0.65)">&#128179;</text>
  <text x="50" y="223" font-size="13" fill="rgba(255,255,255,0.65)">Metode Pembayaran</text>
  <text x="24" y="263" font-size="15" fill="rgba(255,255,255,0.65)">&#128203;</text>
  <text x="50" y="263" font-size="13" fill="rgba(255,255,255,0.65)">Pesanan</text>
  <text x="24" y="303" font-size="15" fill="rgba(255,255,255,0.65)">&#128200;</text>
  <text x="50" y="303" font-size="13" fill="rgba(255,255,255,0.65)">Laporan</text>
  <rect x="0" y="870" width="250" height="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="12" y="880" width="226" height="30" rx="6" fill="rgba(255,255,255,0.1)"/>
  <text x="125" y="899" text-anchor="middle" font-size="12" fill="white">Dark Mode</text>
  <rect x="12" y="916" width="226" height="28" rx="6" fill="#E74C3C"/>
  <text x="125" y="934" text-anchor="middle" font-size="12" font-weight="600" fill="white">Logout</text>
  <!-- Topbar -->
  <rect x="250" y="0" width="1190" height="52" fill="url(#tbGrad)"/>
  <text x="270" y="32" font-size="20" fill="white">&#9776;</text>
  <text x="1410" y="33" text-anchor="end" font-size="13" fill="white">Logout</text>
  <!-- content-header: page title -->
  <text x="270" y="82" font-size="22" font-weight="bold" fill="#333">Tambah Menu Baru</text>
  <text x="270" y="100" font-size="12" fill="#999">Menu / Tambah Menu Baru</text>
  <!-- Form Card -->
  <rect x="270" y="108" width="1110" height="760" rx="12" fill="white" stroke="#EEEEEE" stroke-width="1"/>
  <rect x="270" y="108" width="1110" height="48" rx="12" fill="#FAFAFA"/>
  <rect x="270" y="132" width="1110" height="24" fill="#FAFAFA"/>
  <text x="298" y="136" font-size="14" font-weight="bold" fill="#333">&#43; Tambah Menu Baru</text>
  <!-- Row 1: Nama Menu + Harga side by side -->
  <text x="290" y="176" font-size="12" font-weight="600" fill="#555">Nama Menu</text>
  <rect x="290" y="182" width="510" height="46" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="306" y="210" font-size="13" fill="#BBBBBB">Contoh: Cappuccino</text>
  <text x="820" y="176" font-size="12" font-weight="600" fill="#555">Harga</text>
  <rect x="820" y="182" width="510" height="46" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="836" y="210" font-size="13" fill="#BBBBBB">Contoh: 20000</text>
  <!-- Deskripsi -->
  <text x="290" y="252" font-size="12" font-weight="600" fill="#555">Deskripsi</text>
  <rect x="290" y="258" width="1040" height="90" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="306" y="284" font-size="13" fill="#BBBBBB">Deskripsi menu...</text>
  <!-- Row 2: Kategori + Sub Kategori -->
  <text x="290" y="372" font-size="12" font-weight="600" fill="#555">Kategori</text>
  <rect x="290" y="378" width="510" height="46" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="306" y="406" font-size="13" fill="#555">Makanan</text>
  <text x="790" y="406" text-anchor="end" font-size="14" fill="#AAAAAA">&#9660;</text>
  <text x="820" y="372" font-size="12" font-weight="600" fill="#555">Sub Kategori <tspan font-size="10" fill="#999">(opsional)</tspan></text>
  <rect x="820" y="378" width="510" height="46" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="836" y="406" font-size="13" fill="#BBBBBB">Cth: Menu Sarapan, Main Course...</text>
  <!-- Row 3: Ketersediaan -->
  <text x="290" y="448" font-size="12" font-weight="600" fill="#555">Ketersediaan</text>
  <rect x="290" y="454" width="510" height="46" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="306" y="482" font-size="13" fill="#555">Tersedia</text>
  <text x="790" y="482" text-anchor="end" font-size="14" fill="#AAAAAA">&#9660;</text>
  <!-- Gambar Menu -->
  <text x="290" y="524" font-size="12" font-weight="600" fill="#555">Gambar Menu</text>
  <rect x="290" y="530" width="1040" height="50" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <rect x="294" y="534" width="100" height="42" rx="6" fill="#EEEEEE"/>
  <text x="344" y="560" text-anchor="middle" font-size="11" fill="#888">Pilih File</text>
  <text x="406" y="558" font-size="12" fill="#AAAAAA">Tidak ada file yang dipilih</text>
  <!-- Image Preview Box -->
  <rect x="290" y="590" width="220" height="180" rx="10" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="400" y="682" text-anchor="middle" font-size="30" fill="#DDDDDD">&#128247;</text>
  <text x="400" y="710" text-anchor="middle" font-size="11" fill="#CCCCCC">Preview Gambar</text>
  <!-- Divider -->
  <rect x="290" y="790" width="1040" height="1" fill="#EEEEEE"/>
  <!-- Buttons -->
  <rect x="290" y="804" width="180" height="48" rx="8" fill="#C0392B"/>
  <text x="380" y="832" text-anchor="middle" font-size="14" font-weight="600" fill="white">Simpan Menu</text>
  <rect x="482" y="804" width="160" height="48" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="562" y="832" text-anchor="middle" font-size="14" fill="#555">&#8592; Kembali</text>
  <!-- Footer -->
  <rect x="250" y="908" width="1190" height="36" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1"/>
  <text x="845" y="922" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Copyright &#169; 2025 Little Palembang. All rights reserved.</text>
  <text x="845" y="936" text-anchor="middle" font-size="10" fill="#999">Lorok Pakjo, Kec. Ilir Bar. I, Kota Palembang, Sumatera Selatan.</text>
</svg>
