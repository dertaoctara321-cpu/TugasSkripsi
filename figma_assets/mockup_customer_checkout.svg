<svg xmlns="http://www.w3.org/2000/svg" width="430" height="860" viewBox="0 0 430 860" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="btnRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C0392B"/><stop offset="100%" style="stop-color:#E74C3C"/>
    </linearGradient>
  </defs>
  <!-- Phone frame -->
  <rect x="3" y="3" width="424" height="854" rx="44" fill="#1a1a1a" stroke="#111111" stroke-width="2"/>
  <rect x="16" y="16" width="398" height="828" rx="36" fill="white"/>
  <rect x="16" y="16" width="398" height="36" rx="36" fill="#F5F5F5"/>
  <rect x="16" y="36" width="398" height="16" fill="#F5F5F5"/>
  <rect x="152" y="16" width="126" height="26" rx="13" fill="#1a1a1a"/>
  <!-- Top bar -->
  <rect x="16" y="52" width="398" height="52" fill="white" stroke="#EEEEEE" stroke-width="1"/>
  <rect x="28" y="64" width="28" height="28" rx="6" fill="#F5F5F5"/>
  <text x="42" y="83" text-anchor="middle" font-size="16" fill="#888">←</text>
  <text x="215" y="77" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Detail Pesanan</text>
  <text x="385" y="77" text-anchor="middle" font-size="18">🛒</text>
  <!-- Order summary card -->
  <rect x="28" y="116" width="374" height="220" rx="10" fill="white" stroke="#EEEEEE" stroke-width="1"/>
  <!-- Table header -->
  <rect x="28" y="116" width="374" height="36" rx="10" fill="#FAFAFA"/>
  <rect x="28" y="136" width="374" height="16" fill="#FAFAFA"/>
  <text x="50" y="137" font-size="11" font-weight="bold" fill="#888">ITEM</text>
  <text x="246" y="137" font-size="11" font-weight="bold" fill="#888">QTY</text>
  <text x="298" y="137" font-size="11" font-weight="bold" fill="#888">HARGA</text>
  <text x="363" y="137" font-size="11" font-weight="bold" fill="#888">TOTAL</text>
  <!-- Row 1 -->
  <text x="50" y="174" font-size="12" fill="#333">Pempek Kapal Selam</text>
  <text x="250" y="174" font-size="12" fill="#333">1</text>
  <text x="298" y="174" font-size="12" fill="#333">Rp 25.000</text>
  <text x="388" y="174" text-anchor="end" font-size="12" fill="#333">Rp 25.000</text>
  <line x1="28" y1="186" x2="402" y2="186" stroke="#F5F5F5" stroke-width="1"/>
  <!-- Row 2 -->
  <text x="50" y="208" font-size="12" fill="#333">Mie Celor Palembang</text>
  <text x="250" y="208" font-size="12" fill="#333">1</text>
  <text x="298" y="208" font-size="12" fill="#333">Rp 20.000</text>
  <text x="388" y="208" text-anchor="end" font-size="12" fill="#333">Rp 20.000</text>
  <line x1="28" y1="220" x2="402" y2="220" stroke="#F5F5F5" stroke-width="1"/>
  <!-- Total bayar -->
  <rect x="28" y="298" width="374" height="40" rx="6" fill="#FDEDEC"/>
  <text x="50" y="322" font-size="13" font-weight="bold" fill="#C0392B">Total Bayar</text>
  <text x="390" y="322" text-anchor="end" font-size="14" font-weight="bold" fill="#C0392B">Rp 45.000</text>
  <!-- Form -->
  <text x="30" y="364" font-size="12" font-weight="600" fill="#555">Nama Anda</text>
  <rect x="28" y="372" width="374" height="42" rx="8" fill="white" stroke="#DDDDDD" stroke-width="1.5"/>
  <text x="44" y="397" font-size="13" fill="#888">Masukkan nama Anda...</text>
  <text x="30" y="434" font-size="12" font-weight="600" fill="#555">Lantai Kafe</text>
  <rect x="28" y="442" width="374" height="42" rx="8" fill="white" stroke="#DDDDDD" stroke-width="1.5"/>
  <text x="44" y="467" font-size="13" fill="#555">Lantai 1</text>
  <text x="392" y="469" text-anchor="end" font-size="13" fill="#AAA">▼</text>
  <text x="30" y="506" font-size="12" font-weight="600" fill="#555">Metode Pembayaran</text>
  <rect x="28" y="514" width="374" height="42" rx="8" fill="white" stroke="#DDDDDD" stroke-width="1.5"/>
  <text x="44" y="539" font-size="13" fill="#555">QRIS</text>
  <text x="392" y="541" text-anchor="end" font-size="13" fill="#AAA">▼</text>
  <!-- Submit button -->
  <rect x="28" y="574" width="374" height="50" rx="10" fill="url(#btnRed)"/>
  <text x="215" y="603" text-anchor="middle" font-size="15" font-weight="bold" fill="white">✓ Pesan Sekarang</text>
  <!-- Back link -->
  <text x="215" y="648" text-anchor="middle" font-size="13" fill="#E74C3C">← Tambah Item Lagi</text>
</svg>
