<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="sbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7B0000"/><stop offset="100%" style="stop-color:#5D0000"/>
    </linearGradient>
    <linearGradient id="tbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C0392B"/><stop offset="100%" style="stop-color:#E74C3C"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="960" fill="#F5F5F5"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="250" height="960" fill="url(#sbGrad)"/>
  <rect x="14" y="14" width="44" height="44" rx="22" fill="white"/>
  <text x="36" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">LP</text>
  <text x="66" y="30" font-size="14" font-weight="bold" fill="white">Little Palembang</text>
  <text x="66" y="48" font-size="11" fill="rgba(255,255,255,0.6)">Administrator</text>
  <rect x="0" y="68" width="250" height="1" fill="rgba(255,255,255,0.1)"/>
  <text x="24" y="103" font-size="15" fill="rgba(255,255,255,0.65)">&#128202;</text>
  <text x="50" y="103" font-size="13" fill="rgba(255,255,255,0.65)">Dashboard</text>
  <text x="24" y="143" font-size="15" fill="rgba(255,255,255,0.65)">&#127859;</text>
  <text x="50" y="143" font-size="13" fill="rgba(255,255,255,0.65)">Menu</text>
  <text x="24" y="183" font-size="15" fill="rgba(255,255,255,0.65)">&#128082;</text>
  <text x="50" y="183" font-size="13" fill="rgba(255,255,255,0.65)">Meja &amp; QR</text>
  <rect x="0" y="196" width="4" height="44" fill="white"/>
  <rect x="0" y="196" width="250" height="44" fill="rgba(255,255,255,0.12)"/>
  <text x="24" y="223" font-size="15" fill="white">&#128179;</text>
  <text x="50" y="223" font-size="13" font-weight="600" fill="white">Metode Pembayaran</text>
  <text x="24" y="263" font-size="15" fill="rgba(255,255,255,0.65)">&#128203;</text>
  <text x="50" y="263" font-size="13" fill="rgba(255,255,255,0.65)">Pesanan</text>
  <text x="24" y="303" font-size="15" fill="rgba(255,255,255,0.65)">&#128200;</text>
  <text x="50" y="303" font-size="13" fill="rgba(255,255,255,0.65)">Laporan</text>
  <rect x="0" y="870" width="250" height="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="12" y="880" width="226" height="30" rx="6" fill="rgba(255,255,255,0.1)"/>
  <text x="125" y="899" text-anchor="middle" font-size="12" fill="white">Dark Mode</text>
  <rect x="12" y="916" width="226" height="28" rx="6" fill="#E74C3C"/>
  <text x="125" y="934" text-anchor="middle" font-size="12" font-weight="600" fill="white">Logout</text>
  <!-- Topbar -->
  <rect x="250" y="0" width="1190" height="52" fill="url(#tbGrad)"/>
  <text x="270" y="32" font-size="20" fill="white">&#9776;</text>
  <text x="1410" y="33" text-anchor="end" font-size="13" fill="white">Logout</text>
  <!-- content-header -->
  <text x="270" y="82" font-size="22" font-weight="bold" fill="#333">Tambah Metode Pembayaran</text>
  <text x="270" y="100" font-size="12" fill="#999">Metode Pembayaran / Tambah Baru</text>
  <!-- Form Card -->
  <rect x="270" y="108" width="1110" height="760" rx="12" fill="white" stroke="#EEEEEE" stroke-width="1"/>
  <rect x="270" y="108" width="1110" height="48" rx="12" fill="#FAFAFA"/>
  <rect x="270" y="132" width="1110" height="24" fill="#FAFAFA"/>
  <text x="298" y="136" font-size="14" font-weight="bold" fill="#333">&#43; Tambah Metode Pembayaran Baru</text>
  <!-- Nama Metode -->
  <text x="290" y="176" font-size="12" font-weight="600" fill="#555">Nama Metode Pembayaran</text>
  <rect x="290" y="182" width="1040" height="46" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="306" y="210" font-size="13" fill="#BBBBBB">Contoh: Bank BCA, QRIS Dana</text>
  <text x="290" y="236" font-size="11" fill="#AAAAAA">Contoh: "Bank BCA", "QRIS Dana", "GoPay"</text>
  <!-- Tipe -->
  <text x="290" y="260" font-size="12" font-weight="600" fill="#555">Tipe</text>
  <rect x="290" y="266" width="1040" height="46" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="306" y="294" font-size="13" fill="#555">Transfer Bank</text>
  <text x="1318" y="294" text-anchor="end" font-size="14" fill="#AAAAAA">&#9660;</text>
  <!-- Tipe badges info -->
  <rect x="290" y="320" width="96" height="24" rx="12" fill="#EBF5FB"/>
  <text x="338" y="336" text-anchor="middle" font-size="10" font-weight="600" fill="#2980B9">Transfer Bank</text>
  <rect x="396" y="320" width="56" height="24" rx="12" fill="#FEF9E7"/>
  <text x="424" y="336" text-anchor="middle" font-size="10" font-weight="600" fill="#E67E22">QRIS</text>
  <rect x="462" y="320" width="48" height="24" rx="12" fill="#EAFAF1"/>
  <text x="486" y="336" text-anchor="middle" font-size="10" font-weight="600" fill="#27AE60">Cash</text>
  <!-- Nomor Rekening -->
  <text x="290" y="368" font-size="12" font-weight="600" fill="#555">Nomor Rekening</text>
  <rect x="290" y="374" width="1040" height="46" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="306" y="402" font-size="13" fill="#BBBBBB">1234567890</text>
  <!-- Atas Nama -->
  <text x="290" y="440" font-size="12" font-weight="600" fill="#555">Atas Nama</text>
  <rect x="290" y="446" width="1040" height="46" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="306" y="474" font-size="13" fill="#BBBBBB">PT Little Palembang</text>
  <!-- QR Code Upload -->
  <text x="290" y="514" font-size="12" font-weight="600" fill="#555">Upload QR Code <tspan font-size="10" fill="#999">(Opsional)</tspan></text>
  <rect x="290" y="520" width="1040" height="50" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <rect x="294" y="524" width="100" height="42" rx="6" fill="#EEEEEE"/>
  <text x="344" y="550" text-anchor="middle" font-size="11" fill="#888">Pilih File</text>
  <text x="406" y="548" font-size="12" fill="#AAAAAA">Format: JPG, PNG. Maksimal 2MB</text>
  <!-- Instruksi -->
  <text x="290" y="590" font-size="12" font-weight="600" fill="#555">Instruksi Tambahan <tspan font-size="10" fill="#999">(Opsional)</tspan></text>
  <rect x="290" y="596" width="1040" height="90" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="306" y="622" font-size="13" fill="#BBBBBB">Contoh: Silakan transfer ke rekening di atas dan konfirmasi ke kasir</text>
  <!-- Status -->
  <text x="290" y="706" font-size="12" font-weight="600" fill="#555">Status</text>
  <rect x="290" y="712" width="1040" height="46" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="306" y="740" font-size="13" fill="#555">Aktif</text>
  <text x="1318" y="740" text-anchor="end" font-size="14" fill="#AAAAAA">&#9660;</text>
  <!-- Divider -->
  <rect x="290" y="778" width="1040" height="1" fill="#EEEEEE"/>
  <!-- Buttons -->
  <rect x="290" y="792" width="160" height="48" rx="8" fill="#C0392B"/>
  <text x="370" y="820" text-anchor="middle" font-size="14" font-weight="600" fill="white">Simpan</text>
  <rect x="462" y="792" width="160" height="48" rx="8" fill="white" stroke="#DDDDDD" stroke-width="2"/>
  <text x="542" y="820" text-anchor="middle" font-size="14" fill="#555">&#8592; Kembali</text>
  <!-- Footer -->
  <rect x="250" y="908" width="1190" height="36" fill="#F8F8F8" stroke="#EEEEEE" stroke-width="1"/>
  <text x="845" y="922" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Copyright &#169; 2025 Little Palembang. All rights reserved.</text>
  <text x="845" y="936" text-anchor="middle" font-size="10" fill="#999">Lorok Pakjo, Kec. Ilir Bar. I, Kota Palembang, Sumatera Selatan.</text>
